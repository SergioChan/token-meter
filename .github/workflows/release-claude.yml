name: Release Claude Desktop companion

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import Developer ID Application certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/token-meter-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect notarization key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          chmod 600 "$RUNNER_TEMP/notary-key.p8"

      - name: Build, sign, and notarize
        env:
          APPLE_NOTARY_KEY_FILE: ${{ runner.temp }}/notary-key.p8
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./integrations/claude-desktop/scripts/build-release.sh \
            --version "$VERSION" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --arch "${{ matrix.architecture }}" \
            --node-version v22.23.2 \
            --sign-identity "Developer ID Application: T54 Labs Inc. (DVA9SD82WQ)" \
            --output-dir "$RUNNER_TEMP/release"

      - name: Upload architecture asset
        uses: actions/upload-artifact@v4
        with:
          name: claude-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/release/token-meter-claude-macos-${{ matrix.architecture }}.zip
            ${{ runner.temp }}/release/token-meter-claude-macos-${{ matrix.architecture }}.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release manager
        uses: actions/checkout@v4

      - name: Download signed assets
        uses: actions/download-artifact@v4
        with:
          pattern: claude-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cp scripts/token-meter-claude-macos.sh dist/token-meter-claude
          chmod 755 dist/token-meter-claude
          cd dist
          sha256sum token-meter-claude-macos-*.zip token-meter-claude > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/token-meter-claude-macos-*.zip
            dist/token-meter-claude-macos-*.json
            dist/token-meter-claude
            dist/checksums.txt
