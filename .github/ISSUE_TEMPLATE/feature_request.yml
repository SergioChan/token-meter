name: Feature request
description: Propose a focused improvement to Token Meter.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible problem should this solve?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe behavior, not implementation details.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Security and privacy boundaries
      description: Note any host integration, local data, or external service implications.
    validations:
      required: true
