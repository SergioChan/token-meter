name: Bug report
description: Report reproducible incorrect Token Meter behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include prompts, transcripts, reasoning, credentials, account data, or unredacted rollout files. Report security issues privately through SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Token Meter commit or version
      placeholder: Commit SHA or release
    validations:
      required: true

  - type: input
    id: codex-version
    attributes:
      label: Codex Desktop version
      placeholder: For example, 26.730.61639 (6234)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Session binding
        - Token measurement
        - Rate or alert
        - Renderer injection
        - Launch or cleanup
        - Documentation
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted values only.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private prompts, transcripts, reasoning, credentials, and account data.
          required: true
