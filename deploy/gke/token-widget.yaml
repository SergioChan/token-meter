apiVersion: v1
kind: Namespace
metadata:
  name: token-widget
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-widget-registry
  namespace: token-widget
  annotations:
    iam.gke.io/gcp-service-account: token-widget-registry@tworld-473700.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-widget-registry
  namespace: token-widget
  labels:
    app.kubernetes.io/name: token-widget-registry
    app.kubernetes.io/version: "0.2.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: token-widget-registry
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: token-widget-registry
        app.kubernetes.io/version: "0.2.0"
    spec:
      serviceAccountName: token-widget-registry
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: cloud-sql-proxy
          restartPolicy: Always
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy@sha256:10baeffb98e5a0318b03891049c63aec08ecd99b7aae944227d69bc9d0bbf1e6
          args:
            - --structured-logs
            - --private-ip
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            - --address=127.0.0.1
            - --port=5432
            - tworld-473700:us-west1:token-widget
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 1
            failureThreshold: 60
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: registry
          image: us-west1-docker.pkg.dev/tworld-473700/token-widget/registry@sha256:c9dd93032aa215e273d9424a461f115f96e90d9e51138b8d252c35abc48791fb
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: token-widget-database
                  key: database-url
            - name: TOKEN_METER_REGISTRY_HOST
              value: 0.0.0.0
            - name: TOKEN_METER_REGISTRY_PORT
              value: "8787"
          ports:
            - name: http
              containerPort: 8787
          livenessProbe:
            httpGet:
              path: /api/v1/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: token-widget-registry
  namespace: token-widget
spec:
  timeoutSec: 30
  connectionDraining:
    drainingTimeoutSec: 30
  healthCheck:
    type: HTTP
    requestPath: /api/v1/health
    port: 8787
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: token-widget-registry
  namespace: token-widget
  annotations:
    cloud.google.com/backend-config: '{"default":"token-widget-registry"}'
    cloud.google.com/neg: '{"ingress":true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: token-widget-registry
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: token-widget-api-v2
  namespace: token-widget
spec:
  domains:
    - api.tokenwidget.app
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: token-widget-api
  namespace: token-widget
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.allow-http: "false"
    kubernetes.io/ingress.global-static-ip-name: token-widget-api
    networking.gke.io/managed-certificates: token-widget-api-v2
spec:
  rules:
    - host: api.tokenwidget.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: token-widget-registry
                port:
                  number: 80
