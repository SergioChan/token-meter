<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Token Widget logo">
  <!-- gauge ring: a token coin opened at the bottom -->
  <path d="M 20.5 51.92 A 23 23 0 1 1 43.5 51.92" stroke="#5b6f00" stroke-width="6" stroke-linecap="round"/>
  <!-- live-usage sweep -->
  <path d="M 32 9 A 23 23 0 0 1 48.26 15.74" stroke="#b2c248" stroke-width="6" stroke-linecap="round"/>
  <!-- needle -->
  <line x1="32" y1="32" x2="42.6" y2="21.4" stroke="#5b6f00" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4.5" fill="#5b6f00"/>
  <!-- the token: a single dot resting in the gap -->
  <circle cx="32" cy="55" r="3" fill="#b2c248"/>
</svg>
