<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27 fill=%27none%27><path d=%27M20.5 51.92A23 23 0 1 1 43.5 51.92%27 stroke=%27%235b6f00%27 stroke-width=%277%27 stroke-linecap=%27round%27/><path d=%27M32 9A23 23 0 0 1 48.26 15.74%27 stroke=%27%23b2c248%27 stroke-width=%277%27 stroke-linecap=%27round%27/><line x1=%2732%27 y1=%2732%27 x2=%2742.6%27 y2=%2721.4%27 stroke=%27%235b6f00%27 stroke-width=%276%27 stroke-linecap=%27round%27/><circle cx=%2732%27 cy=%2732%27 r=%275%27 fill=%27%235b6f00%27/><circle cx=%2732%27 cy=%2755%27 r=%273.5%27 fill=%27%23b2c248%27/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Widget — Profile</title>
<meta property="og:site_name" content="Token Widget">
<meta property="og:title" content="Token Widget — Community profile">
<meta property="og:description" content="Live AI coding stats: token activity, streaks, and platform split — computed locally, shared by choice. Get your own widget at tokenwidget.app.">
<meta property="og:image" content="https://www.tokenwidget.app/assets/dashboard.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --canvas: #f7f7f2; --card: #ffffff; --ink: #0e0f0c; --charcoal: #292929;
    --carbon: #454745; --slate: #72726e; --graphite: #818179;
    --ash: #e3e3e3; --stone: #d5d5d2; --fog: #eaebe5;
    --olive: #b2c248; --forest: #5b6f00; --fern: #788c15; --sprout: #e5eacd;
    --cell-1: #dde5b8;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 15px/1.5 var(--sans); letter-spacing: 0.01em; }

  nav { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 0.5px solid var(--stone); box-shadow: rgba(0,0,0,0.03) 0 0 36px; }
  .nav-inner { display: flex; align-items: center; gap: 16px; max-width: 1200px; margin: 0 auto; padding: 12px 24px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; }
  .nav-links { display: flex; gap: 16px; margin-left: 24px; }
  .nav-links a { color: var(--charcoal); font-size: 15px; text-decoration: none; }
  .nav-links a:hover { color: var(--forest); }

  main { max-width: 820px; margin: 0 auto; padding: 48px 24px 72px; }

  .identity { text-align: center; }
  .avatar {
    display: grid; place-items: center; width: 76px; height: 76px; margin: 0 auto 14px;
    background: var(--card); border: 1px solid var(--stone); border-radius: 50%;
  }
  .identity h1 { margin: 0; font: 400 clamp(30px, 5vw, 42px)/1.1 var(--serif); letter-spacing: -0.5px; }
  .identity .sub { margin-top: 10px; color: var(--slate); font-size: 14px; }
  .identity .badge {
    display: inline-block; margin: 0 3px; padding: 4px 12px; font-size: 12.5px;
    background: var(--sprout); border: 1px solid var(--stone); border-radius: 9999px; color: var(--ink);
  }
  .identity .badge.rank { background: var(--card); border-color: var(--fern); color: var(--forest); font-weight: 600; }

  .share-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .share-row button, .share-row a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 15px; font: 500 13px var(--sans); color: var(--carbon);
    background: var(--card); border: 1px solid var(--stone); border-radius: 9999px;
    cursor: pointer; text-decoration: none;
  }
  .share-row button:hover, .share-row a:hover { border-color: var(--fern); color: var(--forest); }
  .share-row .primary { background: var(--forest); border-color: var(--forest); color: #fcfcf8; }
  .share-row .primary:hover { background: #4c5616; color: #fcfcf8; }

  .stat-strip {
    display: grid; grid-template-columns: repeat(5, 1fr);
    margin: 30px 0 32px; border: 1px solid var(--ash); border-radius: 12px;
    background: var(--card); overflow: hidden;
  }
  .stat { padding: 16px 10px; text-align: center; }
  .stat + .stat { border-left: 1px solid var(--fog); }
  .stat strong { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--slate); font-size: 12px; letter-spacing: 0.1px; }

  .panel { background: var(--card); border: 1px solid var(--ash); border-radius: 12px; padding: 20px 22px; margin-bottom: 20px; }
  .panel h2 { margin: 0 0 14px; font-size: 15px; }
  .cal-head { display: flex; align-items: baseline; justify-content: space-between; }
  .cal-head .when { color: var(--graphite); font-size: 12.5px; }
  .calendar-wrap { overflow-x: auto; padding-bottom: 4px; }
  .calendar { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 3px; width: max-content; margin: 0 auto; }
  .months { display: flex; width: max-content; margin: 6px auto 0; color: var(--graphite); font-size: 11px; }
  .months span { width: 14px; flex: 0 0 14px; }
  .months span.label { overflow: visible; }
  .cell { width: 11px; height: 11px; border-radius: 2.5px; background: var(--fog); }
  .cell[data-l="1"] { background: var(--cell-1); }
  .cell[data-l="2"] { background: var(--olive); }
  .cell[data-l="3"] { background: var(--fern); }
  .cell[data-l="4"] { background: var(--forest); }
  .cal-legend { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 10px; color: var(--graphite); font-size: 12px; }
  .cal-legend .cell { display: inline-block; }

  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .columns .panel { margin-bottom: 0; }
  .col { display: flex; flex-direction: column; gap: 20px; }

  .plat-row { margin-bottom: 12px; }
  .plat-head { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 4px; }
  .plat-head .name { font-weight: 600; }
  .plat-head .val { color: var(--slate); font-variant-numeric: tabular-nums; }
  .plat-track { height: 8px; background: var(--fog); border-radius: 4px; overflow: hidden; }
  .plat-fill { display: block; height: 100%; background: var(--fern); border-radius: 0 4px 4px 0; min-width: 2px; }

  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--fog); font-size: 13.5px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--slate); }
  .kv .v { font-variant-numeric: tabular-nums; font-weight: 600; }
  .kv .v small { color: var(--graphite); font-weight: 400; }

  .hours-chart { display: flex; align-items: flex-end; gap: 2px; height: 56px; }
  .hours-chart span { flex: 1; background: var(--fern); border-radius: 2px 2px 0 0; min-height: 1px; }
  .hours-labels { display: flex; justify-content: space-between; margin-top: 4px; color: var(--graphite); font-size: 11px; }

  .empty { margin: 60px auto; max-width: 420px; text-align: center; color: var(--slate); }
  .empty .mark { font-size: 40px; margin-bottom: 10px; }
  .empty h2 { font: 400 24px var(--serif); color: var(--ink); margin: 0 0 8px; }

  footer { margin-top: 36px; text-align: center; color: var(--graphite); font-size: 12.5px; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) {
    .stat-strip { grid-template-columns: 1fr 1fr; }
    .stat + .stat { border-left: none; }
    .columns { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a class="brand" href="/"><svg width="18" height="18" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M20.5 51.92A23 23 0 1 1 43.5 51.92" stroke="#5b6f00" stroke-width="7" stroke-linecap="round"/><path d="M32 9A23 23 0 0 1 48.26 15.74" stroke="#b2c248" stroke-width="7" stroke-linecap="round"/><line x1="32" y1="32" x2="42.6" y2="21.4" stroke="#5b6f00" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="32" r="5" fill="#5b6f00"/><circle cx="32" cy="55" r="3.5" fill="#b2c248"/></svg>Token Widget</a>
    <div class="nav-links"><a href="/leaderboard">Leaderboard</a></div>
  </div>
</nav>
<main>
  <section class="identity">
    <div class="avatar"><svg width="40" height="40" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M20.5 51.92A23 23 0 1 1 43.5 51.92" stroke="#5b6f00" stroke-width="7" stroke-linecap="round"/><path d="M32 9A23 23 0 0 1 48.26 15.74" stroke="#b2c248" stroke-width="7" stroke-linecap="round"/><line x1="32" y1="32" x2="42.6" y2="21.4" stroke="#5b6f00" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="32" r="5" fill="#5b6f00"/><circle cx="32" cy="55" r="3.5" fill="#b2c248"/></svg></div>
    <h1 id="handle">@—</h1>
    <p class="sub" id="badges"></p>
    <div class="share-row" id="share-row" hidden>
      <button class="primary" id="share-png" type="button">⬇︎&nbsp;Save card as PNG</button>
      <a id="share-x" target="_blank" rel="noopener">Share on X</a>
      <a id="share-linkedin" target="_blank" rel="noopener">Share on LinkedIn</a>
      <button id="share-copy" type="button">Copy link</button>
    </div>
  </section>

  <div id="content" hidden>
    <section class="stat-strip" id="stat-strip" aria-label="Lifetime stats"></section>

    <section class="panel">
      <div class="cal-head"><h2>Token activity</h2><span class="when" id="updated"></span></div>
      <div class="calendar-wrap"><div class="calendar" id="calendar"></div><div class="months" id="months"></div></div>
      <div class="cal-legend">Less
        <span class="cell" data-l="0"></span><span class="cell" data-l="1"></span><span class="cell" data-l="2"></span><span class="cell" data-l="3"></span><span class="cell" data-l="4"></span>
      More</div>
    </section>

    <div class="columns">
      <div class="col">
        <section class="panel" id="platforms-panel" hidden>
          <h2>By platform</h2>
          <div id="platforms"></div>
        </section>
        <section class="panel" id="patterns-panel" hidden>
          <h2>Coding patterns</h2>
          <div id="patterns"></div>
        </section>
      </div>
      <div class="col">
        <section class="panel" id="insights-panel" hidden>
          <h2>Activity insights</h2>
          <div id="insights"></div>
        </section>
        <section class="panel" id="rhythm-panel" hidden>
          <h2>Daily rhythm</h2>
          <div class="hours-chart" id="hours-chart" aria-label="Tokens by hour of day"></div>
          <div class="hours-labels"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span><span>11pm</span></div>
        </section>
        <section class="panel" id="top-days-panel" hidden>
          <h2>Top usage days</h2>
          <div id="top-days"></div>
        </section>
      </div>
    </div>
  </div>

  <div class="empty" id="empty" hidden>
    <div class="mark" id="empty-mark">🌱</div>
    <h2 id="empty-title"></h2>
    <p id="empty-copy"></p>
  </div>

  <footer>Signed aggregate data, uploaded with the member's consent. Session content never leaves their machine.</footer>
</main>
<script>
  function formatTokenCount(value) {
    const number = Math.max(0, Number(value) || 0);
    const units = [
      [1e12, "T"],
      [1e9, "B"],
      [1e6, "M"],
      [1e3, "K"],
    ];
    const unit = units.find(([threshold]) => number >= threshold);
    if (!unit) return String(Math.round(number));
    return `${(number / unit[0]).toFixed(1).replace(/\.0$/, "")}${unit[1]}`;
  }
  const fmt = formatTokenCount;
  const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const hourLabel = (h) => (h === 0 ? "12am" : h < 12 ? h + "am" : h === 12 ? "12pm" : h - 12 + "pm");
  const fmtDuration = (ms) => {
    const hours = ms / 3600000;
    if (hours >= 48) return (hours / 24).toFixed(1) + "d";
    if (hours >= 1) return Math.floor(hours) + "h " + Math.round((hours % 1) * 60) + "m";
    return Math.round(ms / 60000) + "m";
  };
  const el = (id) => document.getElementById(id);

  // Share targets for a public profile. The install link rides along in the
  // post text so every share doubles as an invitation.
  function buildShareLinks(handle, lifetimeLabel) {
    const url = `https://www.tokenwidget.app/u/${encodeURIComponent(handle)}`;
    const text = `My AI coding stats: ${lifetimeLabel} lifetime tokens, live on the Token Widget leaderboard. Get your own widget at tokenwidget.app`;
    return {
      url,
      x: `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,
      linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}`,
    };
  }

  // A designed 1200x630 card drawn from scratch — no page screenshot, no
  // external libraries. The install URL is part of the image itself.
  async function drawShareCard(canvas, card) {
    const W = 1200, H = 630;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    try { await document.fonts.ready; } catch { /* draw with fallbacks */ }
    const SERIF = '"Playfair Display", Georgia, serif';
    const SANS = '"DM Sans", -apple-system, "Segoe UI", sans-serif';

    ctx.fillStyle = "#f7f7f2"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#e3e3e3";
    ctx.beginPath(); ctx.roundRect(36, 36, W - 72, H - 72, 22); ctx.fill(); ctx.stroke();

    // coin-ring gauge mark
    const cx = 108, cy = 106, r = 26;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#5b6f00"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0.65 * Math.PI, 0.35 * Math.PI); ctx.stroke();
    ctx.strokeStyle = "#b2c248";
    ctx.beginPath(); ctx.arc(cx, cy, r, 1.28 * Math.PI, 1.75 * Math.PI); ctx.stroke();
    ctx.strokeStyle = "#5b6f00"; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + r * 0.62, cy - r * 0.62); ctx.stroke();
    ctx.fillStyle = "#5b6f00";
    ctx.beginPath(); ctx.arc(cx, cy, 6, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = "#b2c248";
    ctx.beginPath(); ctx.arc(cx, cy + r, 4, 0, 2 * Math.PI); ctx.fill();

    ctx.fillStyle = "#0e0f0c";
    ctx.font = `600 30px ${SANS}`;
    ctx.fillText("Token Widget", 152, 116);

    ctx.font = `72px ${SERIF}`;
    ctx.fillText(card.title, 76, 236);
    if (card.rankLabel) {
      ctx.font = `600 26px ${SANS}`;
      ctx.fillStyle = "#5b6f00";
      ctx.fillText(card.rankLabel, 82, 282);
    }

    // heatmap: last 17 weeks, top right
    const cellPalette = ["#eaebe5", "#dde5b8", "#b2c248", "#788c15", "#5b6f00"];
    const totals = card.dayLevels;
    const cell = 16, gap = 4;
    const hx = W - 76 - 17 * (cell + gap), hy = 96;
    for (let i = 0; i < totals.length && i < 119; i += 1) {
      const week = Math.floor(i / 7), day = i % 7;
      ctx.fillStyle = cellPalette[totals[i]] ?? cellPalette[0];
      ctx.beginPath();
      ctx.roundRect(hx + week * (cell + gap), hy + day * (cell + gap), cell, cell, 4);
      ctx.fill();
    }

    // stat row
    const stats = card.stats;
    const colWidth = (W - 152) / stats.length;
    stats.forEach((stat, index) => {
      const x = 76 + index * colWidth;
      ctx.fillStyle = "#0e0f0c";
      ctx.font = `600 54px ${SANS}`;
      ctx.fillText(stat.value, x, 420);
      ctx.fillStyle = "#72726e";
      ctx.font = `24px ${SANS}`;
      ctx.fillText(stat.label, x, 456);
    });

    // platform split bar
    const platforms = card.platforms.filter((p) => p.tokens > 0);
    const total = platforms.reduce((sum, p) => sum + p.tokens, 0);
    if (total > 0) {
      const barX = 76, barY = 500, barW = W - 152, barH = 20;
      const shades = ["#5b6f00", "#b2c248", "#dde5b8"];
      let x = barX;
      ctx.beginPath(); ctx.roundRect(barX, barY, barW, barH, 10); ctx.save(); ctx.clip();
      platforms.forEach((p, index) => {
        const w = (p.tokens / total) * barW;
        ctx.fillStyle = shades[index % shades.length];
        ctx.fillRect(x, barY, w, barH);
        x += w;
      });
      ctx.restore();
      let lx = barX;
      ctx.font = `500 22px ${SANS}`;
      platforms.forEach((p, index) => {
        ctx.fillStyle = shades[index % shades.length];
        ctx.beginPath(); ctx.arc(lx + 8, 552, 7, 0, 2 * Math.PI); ctx.fill();
        ctx.fillStyle = "#454745";
        const label = `${p.name} ${Math.round((p.tokens / total) * 100)}%`;
        ctx.fillText(label, lx + 24, 560);
        lx += 24 + ctx.measureText(label).width + 32;
      });
    }

    // install link, part of the picture itself
    ctx.fillStyle = "#5b6f00";
    ctx.font = `600 26px ${SANS}`;
    const invite = "Get your own widget → tokenwidget.app";
    ctx.fillText(invite, W - 96 - ctx.measureText(invite).width, 560);
    return canvas;
  }

  function emptyState(mark, title, copy) {
    el("empty-mark").textContent = mark;
    el("empty-title").textContent = title;
    el("empty-copy").textContent = copy;
    el("empty").hidden = false;
    el("content").hidden = true;
  }

  function kvRow(host, key, value) {
    if (value == null) return;
    const row = document.createElement("div");
    row.className = "kv";
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = key;
    const v = document.createElement("span");
    v.className = "v";
    if (typeof value === "object") {
      v.append(value);
    } else {
      v.textContent = value;
    }
    row.append(k, v);
    host.append(row);
    return row;
  }

  function statTile(host, value, label) {
    const tile = document.createElement("div");
    tile.className = "stat";
    const strong = document.createElement("strong");
    strong.textContent = value;
    const small = document.createElement("small");
    small.textContent = label;
    tile.append(strong, small);
    host.append(tile);
  }

  (async () => {
    const handle = decodeURIComponent(location.pathname.split("/").pop() || "").replace(/^@/, "").toLowerCase();
    el("handle").textContent = "@" + (handle || "unknown");
    document.title = "Token Widget — @" + handle;

    let profile = null;
    let status = 0;
    try {
      const response = await fetch(`/api/v1/profile/${encodeURIComponent(handle)}`);
      status = response.status;
      if (response.ok) profile = await response.json();
    } catch { /* handled below */ }

    if (!profile && status === 404) {
      return emptyState("🔍", "No community profile", `Nobody has claimed @${handle} on the leaderboard yet.`);
    }
    if (!profile) {
      return emptyState("⚡", "Profile unavailable", "The registry could not be reached — try again in a moment.");
    }
    if (profile.shared === false) {
      return emptyState("🏡", "This member keeps their data local", `@${handle} is claimed, but its owner currently shares nothing with the community. Their tokens stay on their machine.`);
    }

    const s = profile.stats || {};
    const days = profile.days || [];
    el("content").hidden = false;

    /* badges: membership, rank (from the leaderboard), freshness */
    const badges = el("badges");
    const member = document.createElement("span");
    member.className = "badge";
    member.textContent = "Community member";
    badges.append(member);
    let weeklyRank = null;
    fetch("/api/v1/leaderboard").then((r) => r.json()).then(({ rows }) => {
      const index = (rows ?? []).findIndex((row) => row.handle === handle);
      if (index >= 0) {
        weeklyRank = index + 1;
        const rank = document.createElement("span");
        rank.className = "badge rank";
        rank.textContent = `#${index + 1} this week`;
        badges.append(rank);
      }
    }).catch(() => {});

    if (profile.updatedAtMs) {
      const ageMs = Date.now() - profile.updatedAtMs;
      const label = ageMs < 90 * 60_000
        ? `updated ${Math.max(1, Math.round(ageMs / 60_000))}m ago`
        : ageMs < 48 * 3_600_000
          ? `updated ${Math.round(ageMs / 3_600_000)}h ago`
          : `updated ${Math.round(ageMs / 86_400_000)}d ago`;
      el("updated").textContent = label;
    }

    /* stat strip — mirrors the local dashboard's five tiles */
    const strip = el("stat-strip");
    statTile(strip, fmt(s.lifetimeTokens ?? 0), "Lifetime tokens");
    statTile(strip, fmt(profile.weekTokens ?? 0), "Past 7 days");
    statTile(strip, s.peakDay ? fmt(s.peakDay.tokens) : "—", "Peak day");
    statTile(strip, (s.currentStreakDays ?? 0) + (s.currentStreakDays === 1 ? " day" : " days"), "Current streak");
    statTile(strip, (s.longestStreakDays ?? 0) + (s.longestStreakDays === 1 ? " day" : " days"), "Longest streak");

    /* activity calendar — 17 weeks of uploaded daily totals */
    const totals = {};
    for (const day of days) totals[day.date] = day.total;
    const nonzero = days.map((d) => d.total).filter((t) => t > 0).sort((a, b) => a - b);
    const q = (p) => (nonzero.length ? nonzero[Math.min(nonzero.length - 1, Math.floor(nonzero.length * p))] : Infinity);
    const t1 = q(0.25), t2 = q(0.5), t3 = q(0.75);
    const level = (t) => (t <= 0 ? 0 : t >= t3 ? 4 : t >= t2 ? 3 : t >= t1 ? 2 : 1);
    // Full-year strip, same window as the local dashboard: weeks before the
    // uploaded history simply render empty.
    const calendar = el("calendar");
    const now = new Date();
    const WINDOW = 371;
    const first = new Date(now);
    first.setDate(first.getDate() - (WINDOW - 1));
    const leading = first.getDay();
    for (let pad = 0; pad < leading; pad += 1) {
      const cell = document.createElement("span");
      cell.className = "cell";
      cell.style.visibility = "hidden";
      calendar.append(cell);
    }
    const cellDates = [];
    for (let i = WINDOW - 1; i >= 0; i -= 1) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      cellDates.push(d);
      const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      const cell = document.createElement("span");
      cell.className = "cell";
      cell.dataset.l = String(level(totals[key] || 0));
      cell.title = `${key} — ${(totals[key] || 0).toLocaleString()} tokens`;
      calendar.append(cell);
    }
    const monthsHost = el("months");
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    let lastMonth = -1;
    const weeks = Math.ceil((leading + WINDOW) / 7);
    for (let week = 0; week < weeks; week += 1) {
      const index = Math.min(cellDates.length - 1, Math.max(0, week * 7 - leading));
      const month = cellDates[index].getMonth();
      const label = document.createElement("span");
      if (month !== lastMonth) {
        label.textContent = monthNames[month];
        label.className = "label";
        lastMonth = month;
      }
      monthsHost.append(label);
    }

    /* by platform — tokens plus sessions when the newer payload has them */
    const platformNames = { claudeCode: "Claude Code", codex: "Codex", cline: "Cline" };
    const platformTokens = Object.entries(platformNames)
      .map(([key, name]) => ({
        key,
        name,
        tokens: s.byPlatform?.[key] ?? 0,
        sessions: s.byPlatformSessions?.[key],
      }))
      .filter((platform) => platform.tokens > 0);
    if (platformTokens.length) {
      el("platforms-panel").hidden = false;
      const host = el("platforms");
      const max = Math.max(...platformTokens.map((p) => p.tokens));
      const total = platformTokens.reduce((sum, p) => sum + p.tokens, 0);
      for (const platform of platformTokens) {
        const row = document.createElement("div");
        row.className = "plat-row";
        const share = Math.round((platform.tokens / total) * 100);
        const head = document.createElement("div");
        head.className = "plat-head";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = platform.name;
        const val = document.createElement("span");
        val.className = "val";
        val.textContent = `${fmt(platform.tokens)} · ${share}%` +
          (platform.sessions != null ? ` · ${platform.sessions} sessions` : "");
        head.append(name, val);
        const track = document.createElement("div");
        track.className = "plat-track";
        const fill = document.createElement("span");
        fill.className = "plat-fill";
        fill.style.width = `${(platform.tokens / max) * 100}%`;
        track.append(fill);
        row.append(head, track);
        host.append(row);
      }
    }

    /* coding patterns — only rows the payload actually carries */
    const patterns = el("patterns");
    if (s.cacheReadShare != null) kvRow(patterns, "Cache hit rate", (s.cacheReadShare * 100).toFixed(1) + "%");
    if (s.outputShare != null && s.outputShare > 0) {
      kvRow(patterns, "Read : write ratio", Math.round((1 - s.outputShare) / s.outputShare).toLocaleString() + " : 1");
    }
    if (s.medianSessionTokens != null) kvRow(patterns, "Median session", fmt(s.medianSessionTokens));
    if (s.largestSessionTokens != null) kvRow(patterns, "Largest session", fmt(s.largestSessionTokens));
    if (s.longestSessionMs != null && s.longestSessionMs > 0) kvRow(patterns, "Longest session", fmtDuration(s.longestSessionMs));
    if (s.peakHour != null) kvRow(patterns, "Peak hour", hourLabel(s.peakHour));
    if (s.busiestWeekday != null) kvRow(patterns, "Busiest weekday", WEEKDAYS[s.busiestWeekday]);
    el("patterns-panel").hidden = patterns.childElementCount === 0;

    /* activity insights */
    const insights = el("insights");
    if (s.daysActive != null && s.daysObserved != null) kvRow(insights, "Days active", `${s.daysActive} / ${s.daysObserved}`);
    if (s.avgPerActiveDay != null) kvRow(insights, "Average per active day", fmt(s.avgPerActiveDay));
    if (s.sessionCount != null) kvRow(insights, "Sessions tracked", String(s.sessionCount));
    if (s.firstActivityDate != null) kvRow(insights, "Tracking since", s.firstActivityDate);
    el("insights-panel").hidden = insights.childElementCount === 0;

    /* daily rhythm */
    if (Array.isArray(s.hours) && s.hours.length === 24 && s.hours.some((h) => h > 0)) {
      el("rhythm-panel").hidden = false;
      const host = el("hours-chart");
      const max = Math.max(...s.hours);
      s.hours.forEach((tokens, hour) => {
        const bar = document.createElement("span");
        bar.style.height = Math.max(2, (tokens / max) * 100) + "%";
        bar.title = `${hourLabel(hour)} — ${fmt(tokens)} tokens`;
        if (tokens === 0) bar.style.opacity = "0.18";
        host.append(bar);
      });
    }

    /* share row: social links, copy, and the downloadable PNG card */
    const links = buildShareLinks(handle, fmt(s.lifetimeTokens ?? 0));
    el("share-x").href = links.x;
    el("share-linkedin").href = links.linkedin;
    el("share-copy").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(links.url);
        el("share-copy").textContent = "Copied ✓";
        setTimeout(() => { el("share-copy").textContent = "Copy link"; }, 1500);
      } catch { /* clipboard unavailable */ }
    });
    el("share-png").addEventListener("click", async () => {
      const dayLevels = [];
      for (let i = 118; i >= 0; i -= 1) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        dayLevels.push(level(totals[key] || 0));
      }
      const canvas = document.createElement("canvas");
      await drawShareCard(canvas, {
        title: `@${handle}`,
        rankLabel: weeklyRank ? `#${weeklyRank} on the community leaderboard this week` : null,
        dayLevels,
        stats: [
          { value: fmt(s.lifetimeTokens ?? 0), label: "Lifetime tokens" },
          { value: fmt(profile.weekTokens ?? 0), label: "Past 7 days" },
          { value: s.peakDay ? fmt(s.peakDay.tokens) : "—", label: "Peak day" },
          { value: `${s.currentStreakDays ?? 0}d`, label: "Streak" },
        ],
        platforms: Object.entries(platformNames).map(([key, name]) => ({
          name,
          tokens: s.byPlatform?.[key] ?? 0,
        })),
      });
      canvas.toBlob((blob) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `token-widget-${handle}.png`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5_000);
      });
    });
    el("share-row").hidden = false;

    /* top usage days */
    if (Array.isArray(s.topDays) && s.topDays.length) {
      el("top-days-panel").hidden = false;
      const host = el("top-days");
      for (const day of s.topDays.slice(0, 5)) {
        const label = new Date(day.date + "T12:00:00").toLocaleDateString("en-US", {
          month: "short", day: "numeric", year: "numeric",
        });
        const value = document.createElement("span");
        value.append(fmt(day.tokens) + " ");
        const unit = document.createElement("small");
        unit.textContent = "tokens";
        value.append(unit);
        kvRow(host, label, value);
      }
    }
  })();
</script>
</body>
</html>
